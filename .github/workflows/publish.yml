# Test every push and pull request. On pushes to main, publish @wexare/laya-web to npm when its
# package.json version is not on the registry yet; bump the version to release.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this repository, and
# each release gets a provenance attestation. One-time setup on npmjs.com:
#   @wexare/laya-web -> Settings -> Trusted publishing -> GitHub Actions,
#   with this repository and the workflow file name "publish.yml".
name: publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # one release at a time; never cancel a publish halfway
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow (trusted publishing + provenance)
    defaults:
      run:
        working-directory: packages/laya-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Is this version new?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack rebuilds dist/ and copies LICENSE + LICENSE-THIRD-PARTY into the package
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
